name: CI

on:
  pull_request:
    branches:
      - master
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Install Airflow dependencies for DAG validation
        run: |
          python -m pip install \
            "apache-airflow==3.2.2" \
            apache-airflow-providers-docker \
            graphviz

      - name: Initialize Airflow metadata database
        run: airflow db migrate

      - name: Validate Airflow DAG imports
        env:
          BCB_POSTGRES_HOST: test
          BCB_POSTGRES_USER: test
          BCB_POSTGRES_PASSWORD: test
          BCB_POSTGRES_DB: test
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
        run: |
          python - <<'PY'
          from airflow.dag_processing.dagbag import DagBag

          dagbag = DagBag(include_examples=False)

          if dagbag.import_errors:
              for filename, error in dagbag.import_errors.items():
                  print(f"{filename}:")
                  print(error)
              raise SystemExit(1)

          print("All DAGs imported successfully.")
          PY

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gerson/bcb-pipeline:2.0
